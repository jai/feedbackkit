# The hourly release: when ci passes on main, on the hour's cron, or by hand, and at most once an hour, the newest commit on main whose `ci` run passed (the package's tests,
# the Worker's and the demo's end-to-end UI test) becomes the next version's tag and GitHub Release, when the commits
# since the last tag hold a feat, fix or breaking change (release/version.mjs). PRHub and Agent Pager pin these tags.
name: release

on:
  # ci finished on main: release its commit now when it passed, instead of waiting for the cron. GitHub skips
  # scheduled runs for hours at a time (the last one ran 2026-11-15 01:59 UTC), so the cron is the backup.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # From ci, only a push to main that passed; release.mjs still picks main's newest green commit.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      # The jai-agents GitHub App token can create a tag over commits that change
      # .github/workflows; github.token cannot (no workflows permission).
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'release/*.test.mjs'
      - run: node release/release.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
