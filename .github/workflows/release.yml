# The hourly release (jai/ci docs/workflow.md), through jai/trips-ci's shared hourly-release action: release-please
# writes the version and changelog commit, which lands on main with no pull request to merge, and a later run tags
# it vX.Y.Z and publishes the GitHub Release once that commit's own ci run passed (the package's tests, the Worker's
# and the demo's end-to-end UI test). At most one release an hour. Started by jai/ci's release-clock Worker every
# hour, by ci passing on a push to main, and by hand. PRHub and Agent Pager pin these tags.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    # GitHub's own runner: free for a public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The jai-agents GitHub App: it can land the release commit and tag commits that change .github/workflows.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: jai/trips-ci/.github/actions/hourly-release@fbb13cbf74fde247183b37b3301a5a4269d27cad # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          ci-workflow: ci.yml
          tag-prefix: v
