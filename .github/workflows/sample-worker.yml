# FeedbackKit's sample app backend (sample-worker/), one click each way: run this workflow by hand with
# action = deploy or teardown (docs/end-to-end-walkthrough.md).
# - deploy: the Worker `feedbackkit-sample` on Jai's Cloudflare account, its secrets APP_KEY and USER_TOKEN, and its
#   URL in the run summary. It needs nothing else on Cloudflare: no D1, R2 or Durable Object.
# - teardown: deletes that Worker, secrets and all, so nothing sample-named is left. Running it again is harmless.
# The Cloudflare token is scoped to Workers Scripts on that one account; it and the keys are repository secrets, never
# printed. workflow_dispatch needs write access to the repo, and secrets never reach a fork.
name: sample-worker
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy or teardown
        required: true
        type: choice
        options: [deploy, teardown]

permissions:
  contents: read

concurrency:
  group: sample-worker
  cancel-in-progress: false

jobs:
  sample-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sample-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FEEDBACKKIT_SAMPLE_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FEEDBACKKIT_SAMPLE_CLOUDFLARE_ACCOUNT_ID }}
      NAME: feedbackkit-sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Test
        if: inputs.action == 'deploy'
        run: npm test && npm run typecheck
      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          APP_KEY: ${{ secrets.FEEDBACKKIT_DEMO_APP_KEY }}
          USER_TOKEN: ${{ secrets.FEEDBACKKIT_DEMO_USER_TOKEN }}
        run: |
          npx wrangler deploy --name "$NAME" | tee deploy.log
          printf '%s' "$APP_KEY" | npx wrangler secret put APP_KEY --name "$NAME"
          printf '%s' "$USER_TOKEN" | npx wrangler secret put USER_TOKEN --name "$NAME"
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::no workers.dev URL in wrangler's output"; exit 1; }
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/feedback/token") && [ "$status" = 401 ] && break
            sleep 5
          done
          [ "$status" = 401 ] || { echo "::error::$url/feedback/token answered $status, not 401 without a sign-in"; exit 1; }
          {
            echo "### Sample app backend deployed"
            echo
            echo "URL: $url"
            echo
            echo "Token route: \`POST $url/feedback/token\` with the demo sign-in (secret FEEDBACKKIT_DEMO_USER_TOKEN)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Teardown
        if: inputs.action == 'teardown'
        run: |
          if npx wrangler delete --name "$NAME" --force 2>&1 | tee delete.log; then
            result="deleted"
          elif grep -qiE 'not found|does not exist|10007' delete.log; then
            result="already gone"
          else
            echo "::error::wrangler delete failed"; exit 1
          fi
          echo "### Sample app backend: $result" >> "$GITHUB_STEP_SUMMARY"
