name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  worker:
    # GitHub's own Linux runner: free for a public repo (jai/ci RULES.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  demo:
    # The demo app builds from a fresh clone, for iPhone and Mac, against the package by local path.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen --spec Demo/project.yml
      - run: >-
          xcodebuild build -project Demo/FeedbackDemo.xcodeproj -scheme FeedbackDemo
          -destination 'generic/platform=iOS Simulator' -destination 'generic/platform=macOS'
