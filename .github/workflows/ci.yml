name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One run at a time on main. A run in progress always finishes, so its commit can be released. A newer push
# replaces a run that is still waiting to start: the hourly release takes the newest green commit anyway.
concurrency:
  # A release commit gets a group of its own, so a newer push never replaces its waiting run and the release can tag.
  # Other pushes share one group: the newest waiting run replaces older waiting ones. Pull requests group by ref.
  group: "ci-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'chore(main): release') && github.sha || 'main' }}"
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    # make lint typecheck: SwiftFormat, SwiftLint, swift build (the kit and the menu bar app); oxfmt and oxlint for
    # both Workers; ruff and Pyrefly for the runner; actionlint, shfmt, ShellCheck and gitleaks.
    # GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make setup
      - run: make lint typecheck
  test:
    name: Unit Tests
    # make test: swift test for the kit and the menu bar app, node --test for both Workers, and the runner's tests on
    # Python 3.14 (mise.toml). GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags too: the API check compares with the latest release.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make setup
      - run: make test SWIFT_TEST_ARGS='--skip "FeedbackKitTests.(FeedbackLiveTests|FeedbackDirectTests)"'
      # Never breaking (AGENTS.md): apps take every release, so a change that removes or changes public API fails here,
      # and the release, which waits for a green ci run, does not go out.
      - name: No public API break since the latest release
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          echo "Comparing with $base"
          swift package diagnose-api-breaking-changes "$base" --products FeedbackKit
      # The suites on AgentChatKit's live dev host, on their own and allowed to fail: on GitHub's macOS 26 runner the
      # test process dies with SIGBUS in the Swift task allocator once several of them share it (jai/agentchatkit#3).
      # They pass on macOS 27. Their result still shows; it does not turn main red.
      - name: Live suites (allowed to fail, jai/agentchatkit#3)
        continue-on-error: true
        run: swift test --filter "FeedbackKitTests.(FeedbackLiveTests|FeedbackDirectTests)"
  runner-menu:
    # The FeedbackKit Runner menu bar app (runner/MenuBar): its bundle (its tests are in Unit Tests). Each release
    # publishes it (deploy.yml, job runner-menu).
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runner/MenuBar
    steps:
      - uses: actions/checkout@v4
      - run: ./bundle.sh FeedbackKitRunner.zip
  demo:
    # The demo app builds from a fresh clone, for iPhone and Mac, against the package by local path. Then end to end:
    # FeedbackDemoUITests drives the app on an iPhone simulator through each role's flows on the in-app mock Worker.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen --spec Demo/project.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the matching live server
        run: >-
          xcodebuild -resolvePackageDependencies -project Demo/FeedbackDemo.xcodeproj
          -scheme FeedbackDemo -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/tmp/swift-packages"
      - name: Start the package's real ACP host
        run: >-
          node tmp/swift-packages/checkouts/agentchatkit/server/dev/host.ts --port 8788
          > "$RUNNER_TEMP/feedback-live-host.log" 2>&1 &
      - run: >-
          xcodebuild build -project Demo/FeedbackDemo.xcodeproj -scheme FeedbackDemo
          -destination 'generic/platform=iOS Simulator' -destination 'generic/platform=macOS'
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/tmp/swift-packages"
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-2[6-9]")) | .value[] | select(.name | startswith("iPhone"))]
            | last | .udid // empty')
          [ -n "$id" ] || { xcrun simctl list devices available; echo "::error::no iOS 26+ iPhone simulator"; exit 1; }
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
      - run: mkdir -p tmp/demo-screens
      - name: End-to-end UI test
        env:
          TEST_RUNNER_FEEDBACKDEMO_SCREENSHOTS: ${{ github.workspace }}/tmp/demo-screens
        run: >-
          xcodebuild test -project Demo/FeedbackDemo.xcodeproj -scheme FeedbackDemo
          -destination "platform=iOS Simulator,id=$SIMULATOR" -resultBundlePath e2e.xcresult
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/tmp/swift-packages"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-xcresult
          path: e2e.xcresult

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screens
          path: tmp/demo-screens
          if-no-files-found: ignore
  mac-ui:
    # Public package: GitHub-hosted Mac, separate from Jai's workstations.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen --spec Demo/project.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the matching live server
        run: >-
          xcodebuild -resolvePackageDependencies -project Demo/FeedbackDemo.xcodeproj
          -scheme FeedbackDemo -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/tmp/swift-packages"
      - name: Start the package's real ACP host
        run: >-
          node tmp/swift-packages/checkouts/agentchatkit/server/dev/host.ts --port 8788
          > "$RUNNER_TEMP/feedback-live-host.log" 2>&1 &
      - name: Exercise native Mac conversation controls
        run: |
          mkdir -p tmp
          xcodebuild test -project Demo/FeedbackDemo.xcodeproj -scheme FeedbackDemoMac \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/tmp/swift-packages" \
            -resultBundlePath tmp/mac-ui.xcresult -quiet
      - name: Export rendered Mac pictures
        if: always()
        run: |
          if [ -d tmp/mac-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path tmp/mac-ui.xcresult --output-path tmp/mac-ui-attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-feedback-mac-screens
          path: tmp/mac-ui-attachments
          if-no-files-found: ignore
