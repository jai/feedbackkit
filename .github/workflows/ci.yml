name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to main replaces the run before it: the hourly release takes the newest green commit,
# so an older commit's run only holds a GitHub macOS runner others are waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  worker:
    # GitHub's own Linux runner: free for a public repo (jai/ci RULES.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  sample-worker:
    # The sample app backend (sample-worker/): its tests, on GitHub's own Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sample-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  runner:
    # The runner's tests, on the Python the Mac mini's LaunchAgent runs (Homebrew's 3.14, runner/install.py),
    # standard library only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: make -C runner test
  runner-menu:
    # The FeedbackKit Runner menu bar app (runner/MenuBar): its tests, and on main a build published as the GitHub
    # prerelease `runner-menu` (FeedbackKitRunner.zip), which runner/MenuBar/install.sh downloads on Jai's Mac.
    # Nothing builds on Jai's Macs (jai/ci RULES.md). The tag is not a v* version: the hourly release never reads it.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: runner/MenuBar
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./bundle.sh FeedbackKitRunner.zip
      - name: Publish the runner-menu prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="The FeedbackKit Runner menu bar app, built from ${GITHUB_SHA::7}. Install: runner/MenuBar/README.md."
          # The tag stays where the release was first made; the zip is replaced, and the notes name its commit.
          if gh release view runner-menu >/dev/null 2>&1; then
            gh release edit runner-menu --notes "$notes" --prerelease --latest=false
          else
            gh release create runner-menu --target "$GITHUB_SHA" --title "FeedbackKit Runner (menu bar)" \
              --notes "$notes" --prerelease --latest=false
          fi
          gh release upload runner-menu FeedbackKitRunner.zip --clobber
  release-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'release/*.test.mjs'
  demo:
    # The demo app builds from a fresh clone, for iPhone and Mac, against the package by local path. Then end to end:
    # FeedbackDemoUITests drives the app on an iPhone simulator through each role's flows on the in-app mock Worker.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen --spec Demo/project.yml
      - run: >-
          xcodebuild build -project Demo/FeedbackDemo.xcodeproj -scheme FeedbackDemo
          -destination 'generic/platform=iOS Simulator' -destination 'generic/platform=macOS'
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-2[6-9]")) | .value[] | select(.name | startswith("iPhone"))]
            | last | .udid // empty')
          [ -n "$id" ] || { xcrun simctl list devices available; echo "::error::no iOS 26+ iPhone simulator"; exit 1; }
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
      - name: End-to-end UI test
        run: >-
          xcodebuild test -project Demo/FeedbackDemo.xcodeproj -scheme FeedbackDemo
          -destination "platform=iOS Simulator,id=$SIMULATOR" -resultBundlePath e2e.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-xcresult
          path: e2e.xcresult
