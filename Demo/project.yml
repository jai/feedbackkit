# FeedbackKit's demo app: the package by local path, mocks in process, no Worker unless one is set (README.md).
# `xcodegen` in this folder makes FeedbackDemo.xcodeproj (gitignored).
name: FeedbackDemo
options:
  bundleIdPrefix: com.jaigovindani.feedbackkit
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No team: the simulator needs none and the Mac app signs to run locally.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  FeedbackKit:
    path: ..
  AgentChatKit:
    url: https://github.com/jai/agentchatkit
    from: 0.1.0
  DurableNetworking:
    url: https://github.com/jai/durable-networking
    from: 0.1.0
targets:
  FeedbackDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [FeedbackDemo]
    dependencies:
      - package: FeedbackKit
      - package: AgentChatKit
        product: AgentChatLiveTesting
      - package: DurableNetworking
        product: DurableNetworking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.feedbackkit.demo
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeedbackKit Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  FeedbackDemoUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [FeedbackDemoUITests, SharedUITests]
    dependencies:
      - target: FeedbackDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.feedbackkit.demo.uitests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FeedbackDemo
  FeedbackDemoMacUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources: [FeedbackDemoMacUITests, SharedUITests]
    dependencies:
      - target: FeedbackDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.feedbackkit.demo.macuitests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FeedbackDemo
schemes:
  FeedbackDemoMac:
    build:
      targets:
        FeedbackDemo: all
    test:
      targets:
        - FeedbackDemoMacUITests
  FeedbackDemo:
    build:
      targets:
        FeedbackDemo: all
    test:
      targets:
        - FeedbackDemoUITests
