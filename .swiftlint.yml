included:
  - Sources
  - Tests
  - Demo/FeedbackDemo
  - Demo/FeedbackDemoUITests
  - runner/MenuBar/Sources
  - runner/MenuBar/Tests

excluded:
  - .build
  - runner/MenuBar/.build
  - Demo/FeedbackDemo.xcodeproj

reporter: xcode

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  excluded:
    - at
    - id
    - "on"
    - up
    - x
    - y

trailing_comma:
  mandatory_comma: true

# `CodingKeys` inside a namespaced request/response type is two levels deep.
nesting:
  type_level: 2

disabled_rules:
  - todo
