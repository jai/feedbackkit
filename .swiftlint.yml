included:
  - Sources
  - Tests
  - Demo/FeedbackDemo
  - Demo/FeedbackDemoUITests
  - runner/MenuBar/Sources
  - runner/MenuBar/Tests

excluded:
  - .build
  - runner/MenuBar/.build
  - Demo/FeedbackDemo.xcodeproj

reporter: xcode

# make lint runs SwiftLint with --strict, so a warning fails. The limits below were set when it first ran that way
# (2026-11-16), so the code as it was passes; lower one once the code under it shrinks.
line_length:
  warning: 160
  error: 200
  ignores_comments: true
  # JSON fixtures in the tests are one line each.
  ignores_interpolated_strings: true
large_tuple:
  warning: 3
function_parameter_count:
  warning: 6

identifier_name:
  excluded:
    - at
    - ci
    - id
    - ok
    - "on"
    - pr
    - up
    - x
    - y

# `CodingKeys` inside a namespaced request/response type is two levels deep.
nesting:
  type_level: 2

disabled_rules:
  - todo
  # SwiftFormat owns layout: commas (.swiftformat --commas always), and where a closure's capture list and an else go.
  - trailing_comma
  - closure_parameter_position
  - statement_position
  # SwiftUI-style APIs take several closures.
  - multiple_closures_with_trailing_closure
  # String(decoding:as:) is meant: text is read leniently, never dropped.
  - optional_data_string_conversion
  # `var x: T? = nil` in a SwiftUI view keeps the memberwise initializer's parameter optional with a default.
  - implicit_optional_initialization

custom_rules:
  unit_outside_resources:
    included: "Tests/FeedbackKitTests/Unit/.*\\.swift|Tests/FeedbackKitTestSupport/.*\\.swift|runner/MenuBar/Tests/RunnerMenuCoreTests/.*\\.swift"
    name: Unit tests use controlled inputs
    regex: '\b(FileManager|UserDefaults|URLSession|Process|ProcessInfo|ContinuousClock|NSApplication|UIApplication|NotificationCenter|ImageRenderer|NSImage|UIImage|NSWindow|UIWindow|NSHostingView|NSHostingController|UIHostingController)\b|Task\.sleep|Thread\.sleep|DispatchQueue|Data\(contentsOf:|Bundle\.main|Date\(\)|Date\.now'
    excluded_match_kinds: [comment, doccomment, string]
    message: Move storage, network, platform and elapsed-time checks to integration; inject dependencies for unit logic.
    severity: error
